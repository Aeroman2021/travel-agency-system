spring:
  application:
    name: TravelAgencyApp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travel_agency
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

#  flyway:
#    enabled: true
#    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.myProject: info

server:
  port: 6060

management:
  endpoints:
    web:
      exposure:
        include: "*"






