<div class="register-container">

  <mat-card class="register-card">

    <h2>Create Account</h2>
    <p class="subtitle">Join Travel Agency System</p>

    <form (ngSubmit)="onRegister()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="form.username" name="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="form.password" name="password" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="form.email" name="email" />
      </mat-form-field>

      <div class="row">

        <mat-form-field appearance="outline" class="half">
          <mat-label>First Name</mat-label>
          <input matInput [(ngModel)]="form.firstName" name="firstName" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half">
          <mat-label>Last Name</mat-label>
          <input matInput [(ngModel)]="form.lastName" name="lastName" />
        </mat-form-field>

      </div>

      <button mat-raised-button color="primary" class="full-width">
        Register
      </button>

    </form>

  </mat-card>

</div>
