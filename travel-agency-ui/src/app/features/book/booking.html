<div class="table-container" >

  <div class="table-header">
    <h2>My Booking</h2>
  </div>

  <table mat-table [dataSource]="dataSource" class="booking-table">

    <ng-container matColumnDef="flightNumber">
      <th mat-header-cell *matHeaderCellDef>Flight Number</th>
      <td mat-cell *matCellDef="let bookingView">
        {{ bookingView.flightNumber }}
      </td>
    </ng-container>

    <ng-container matColumnDef="cabinClass">
      <th mat-header-cell *matHeaderCellDef>Cabin Class</th>
      <td mat-cell *matCellDef="let bookingView">
        {{ bookingView.cabinClass }}
      </td>
    </ng-container>

    <ng-container matColumnDef="numberOfPassengers">
      <th mat-header-cell *matHeaderCellDef>number of passengers</th>
      <td mat-cell *matCellDef="let bookingView">
        {{ bookingView.numberOfPassengers }}
      </td>
    </ng-container>



    <ng-container matColumnDef="totalPrice">
      <th mat-header-cell *matHeaderCellDef>Total Price</th>
      <td mat-cell *matCellDef="let bookingView">
        {{ bookingView.totalPrice}}
      </td>
    </ng-container>

    <ng-container matColumnDef="bookingStatus">
      <th mat-header-cell *matHeaderCellDef>Booking status</th>
      <td mat-cell *matCellDef="let bookingView">
        {{ bookingView.bookingStatus }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</div>
