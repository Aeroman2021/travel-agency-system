<form [formGroup]="passengerForm">
  <div formArrayName="passengers">
    <div
      *ngFor="let passenger of passengers.controls; let i = index"
      [formGroupName]="i"
      class="passenger-card"
    >
      <h3> Passenger{{i+1}}</h3>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>National Code</mat-label>
          <input matInput formControlName="ncode">
        </mat-form-field>
      </div>



      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Passport Number</mat-label>
          <input matInput formControlName="passportNumber">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Gender</mat-label>
          <mat-select formControlName="sex">
            <mat-option value="MALE">MALE</mat-option>
            <mat-option value="FEMALE">FEMALE</mat-option>
          </mat-select>
          <input matInput formControlName="passportNumber">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Date of Birth</mat-label>
          <input matInput type="date" formControlName="dob">
        </mat-form-field>
      </div>
    </div>

  </div>

  <div class="actions">
    <button mat-raised-button color="primary" (click) = "submitPassengers()">
      Save Passengers
    </button>

  </div>

</form>
