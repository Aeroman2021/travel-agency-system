<h2>Bookings</h2>

<div class="toolbar">

  <mat-form-field appearance="outline">
    <mat-label>Search Passenger</mat-label>

    <input
      matInput
      [(ngModel)]="searchText"
      placeholder="Search..."
    >
  </mat-form-field>

</div>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z2">


  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let row">
      {{ row.id }}
    </td>
  </ng-container>

  <ng-container matColumnDef="passenger">
    <th mat-header-cell *matHeaderCellDef>Passenger</th>
    <td mat-cell *matCellDef="let row">
      {{ row.passenger }}
    </td>
  </ng-container>

  <ng-container matColumnDef="destination">
    <th mat-header-cell *matHeaderCellDef>Destination</th>
    <td mat-cell *matCellDef="let row">
      {{ row.destination }}
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">
      <span
        class="status"
        [class.paid]="row.status === 'PAID'"
        [class.pending]="row.status === 'PENDING'"
      >
      {{ row.status }}
     </span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumn"
    [style.display]="
    row.passenger.toLowerCase().includes(searchText.toLowerCase())
      ? ''
      : 'none'
  ">
  </tr>

</table>
